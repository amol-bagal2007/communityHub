<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      (function () {
        var EMAIL_KEY = "communityhub_login_email";
        var PASSWORD_KEY = "communityhub_login_password";
        var REMEMBER_KEY = "communityhub_remember_me";
        var sentLoad = false;

        function send(type, data) {
          window.parent.postMessage(
            Object.assign({ isStreamlitMessage: true, type: type }, data),
            "*"
          );
        }

        function readSaved() {
          try {
            var flag = localStorage.getItem(REMEMBER_KEY);
            var remember = flag !== "0";
            if (!remember) {
              return { email: "", password: "", remember: false };
            }
            return {
              email: localStorage.getItem(EMAIL_KEY) || "",
              password: localStorage.getItem(PASSWORD_KEY) || "",
              remember: true,
            };
          } catch (err) {
            return { email: "", password: "", remember: true };
          }
        }

        function writeSaved(email, password, remember) {
          try {
            if (remember) {
              localStorage.setItem(EMAIL_KEY, email || "");
              localStorage.setItem(PASSWORD_KEY, password || "");
              localStorage.setItem(REMEMBER_KEY, "1");
            } else {
              localStorage.removeItem(EMAIL_KEY);
              localStorage.removeItem(PASSWORD_KEY);
              localStorage.setItem(REMEMBER_KEY, "0");
            }
          } catch (err) {}
        }

        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type !== "streamlit:render") {
            return;
          }
          var args = data.args || {};
          if (args.action === "save") {
            writeSaved(args.email, args.password, !!args.remember);
            send("streamlit:setComponentValue", {
              value: { saved: true, token: args.token || "" },
              dataType: "json",
            });
          } else if (!sentLoad) {
            sentLoad = true;
            send("streamlit:setComponentValue", {
              value: readSaved(),
              dataType: "json",
            });
          }
          send("streamlit:setFrameHeight", { height: 0 });
        });

        send("streamlit:componentReady", { apiVersion: 1 });
        send("streamlit:setFrameHeight", { height: 0 });
      })();
    </script>
  </body>
</html>
