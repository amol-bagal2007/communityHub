[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#1a5276"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#1a1a2e"
font = "sans serif"

# Mobile-friendly defaults for society members on phones.
[client]
toolbarMode = "minimal"
